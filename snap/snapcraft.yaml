name: hybris-2404
license: MIT
base: core24
summary: libhybris libraries for core24 snaps
description: |
  A content snap containing libhybris libraries and drivers for `base: core24` snaps.

  It supports hardware compatible to a typical Halium environment that uses the
  opengl interface.

  To use it, just connect it as the respective gpu-2404 provider for the Snap.

  To make use of this snap in your application, allowing for GPU acceleration on
  a broader set of hardware without including the drivers in your snap, refer to the
  documentation below:

  https://mir-server.io/docs/the-gpu-2404-snap-interface
website: https://github.com/Halium-on-Snap/hybris-2404
contact: https://github.com/Halium-on-Snap/hybris-2404/issues
source-code: https://github.com/Halium-on-Snap/hybris-2404
compression: lzo
version: "latest"
grade: stable
confinement: strict

package-repositories:
  - type: apt
    url: http://repo.ubports.com/
    key-id: B551C909D750AA744948E9ED4BD4B4D6DBB583F1
    components: [ main ]
    suites: [ 24.04-2.x ]
  - type: apt
    url: http://archive.ubuntu.com/ubuntu
    suites: [noble]
    components: [main]
    architectures: [i386]
    key-id: F6ECB3762474EDA9D21B7022871920D1991BC93C
    key-server: keyserver.ubuntu.com

platforms:
  arm64:
  armhf:

parts:
  apis:
    # This provides the essential APIs
    #   o libGL.so.0
    #   o libEGL.so.1
    #   o libva.so.2
    #   o libgbm.so.1
    #
    plugin: nil
    stage-packages:
      - libgl1
      - libegl1
      - libgles2
      - libgbm1
      - libvulkan1-hybris # sprinkled across the yaml where libvulkan1 gets staged
    prime:
      - usr/lib
      - usr/share/doc/*/copyright
      - usr/share/glvnd

  drm:
    # DRM userspace
    #   o libdrm.so.2
    plugin: nil
    stage-packages:
      - libdrm2
      - libdrm-common
    organize:
      # Expected at /libdrm by the `gpu-2404` interface
      usr/share/libdrm: libdrm
    prime:
      - usr/lib
      - usr/share/doc/*/copyright
      - libdrm

  va:
    # Video Acceleration API
    #   o libva.so.2
    plugin: nil
    stage-packages:
      - libva2
      - libva-drm2
      - libva-x11-2
      - libva-wayland2
      - libvulkan1-hybris
    prime:
      - usr/lib
      - usr/share/doc/*/copyright

  dri:
    # Userspace drivers
    plugin: nil
    stage-packages:
      - libgl1-mesa-dri
      - libglx-mesa0
      - libvulkan1-hybris
    organize:
      # Expected at /drirc.d by the `gpu-2404` interface
      usr/share/drirc.d: drirc.d
    prime:
      - usr/lib
      - usr/share/doc/*/copyright
      - drirc.d
    override-stage: |
      craftctl default
      rm -f $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvulkan.so.*

  x11:
    # X11 support (not much cost to having this)
    #   o libGLX.so.0 # EDIT: Not anymore, see GL4ES implementation of it's own
    #                         GLX functions, and no libGLX.so.0 gets mapped into
    #                         the process.
    plugin: nil
    stage-packages:
      - libglx0
      - libx11-xcb1
      - libxau6
      - libxcb-dri2-0
      - libxcb-dri3-0
      - libxcb-present0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb1
      - libxdamage1
      - libxdmcp6
      - libxshmfence1
      - libvulkan1-hybris
    organize:
      # Expected at /X11/XErrorDB by the `gpu-2404` interface
      usr/share/X11/XErrorDB: X11/XErrorDB
    prime:
      - usr/lib
      - usr/share/doc/*/copyright
      - X11

  wayland:
    # Wayland support (not much cost to having this)
    plugin: nil
    stage-packages:
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libwayland-server0
    prime:
      - usr/lib
      - usr/share/doc/*/copyright

  tls-padding:
    plugin: nil
    stage-packages:
      - libtls-padding0

  gl4es:
    # libGL.so.1 with libhybris
    after:
      - hybris
    plugin: cmake
    source: https://github.com/ptitSeb/gl4es.git
    source-branch: master
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/
      - -DHYBRIS=ON
    build-packages:
      - libx11-dev

  hybris:
    after:
      - dri
      - wayland
    plugin: nil
    stage-packages:
      - libhybris-common1
      - libhybris
      - libhybris-test
      - libhybris-utils
    override-stage: |
      craftctl default

  # Work around https://bugs.launchpad.net/snapcraft/+bug/2076115
  cleanup:
    after:
    - apis
    - drm
    - dri
    - va
    - x11
    - wayland
    - tls-padding
    - gl4es
    - hybris
    plugin: nil
    build-snaps:
    - core24
    override-prime: |
      set -eux
      cd /snap/core24/current
      find . -type f,l -exec rm -f ${CRAFT_PRIME}/{} \;
      find ${CRAFT_PRIME} -empty -type d -delete

  file-list:
    after: [cleanup]
    plugin: nil
    override-prime: |
      mkdir -p ${CRAFT_PRIME}/snap
      (
        cd ${CRAFT_PART_INSTALL}/../..
        # All the cruft coming from stage packages, but not actually staged
        find $( ls -d */install/{etc,usr/{bin,share/{bug,doc,gcc,gdb,lintian,man}}} ) -type f,l | cut -d/ -f3-
        cd ${CRAFT_PRIME}
        # Everything that is indeed staged
        find usr -type f,l
        # The re-organized bits
        find drirc.d libdrm X11 -type f,l | awk '{ print "usr/share/" $0 }'
      ) | sort -u > ${CRAFT_PRIME}/snap/${CRAFT_ARCH_BUILD_FOR}.list

  scripts:
    after: [file-list]
    plugin: nil
    source: scripts
    override-build: |
      set -x
      SCRIPT=bin/gpu-2404-provider-wrapper
      ARCH_TRIPLETS=( ${CRAFT_ARCH_TRIPLET_BUILD_FOR} )

      [ ${CRAFT_ARCH_BUILD_FOR} == amd64 ] && ARCH_TRIPLETS+=( i386-linux-gnu )

      mkdir -p ${CRAFT_PART_INSTALL}/bin
      sed "s/@ARCH_TRIPLETS@/${ARCH_TRIPLETS[*]}/" \
        ${CRAFT_PART_SRC}/${SCRIPT}.in \
        > ${CRAFT_PART_INSTALL}/${SCRIPT}
      chmod 555 ${CRAFT_PART_INSTALL}/${SCRIPT}

slots:
  gpu-2404:
    interface: content
    read: [$SNAP]
